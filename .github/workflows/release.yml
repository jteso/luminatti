# Release workflow: builds macOS + Linux binaries and creates a GitHub release.
# crates.io publishing is optional and enabled with PUBLISH_CRATE=true.
#
# Push a vX.Y.Z tag pointing to a commit on origin/main to start a release.
# ./release.sh prepares the version commit and pushes the tag in that order.
#
# One-time setup: allow v* tags in the "release" environment deployment
# branch/tag rules, and add publish credentials as environment secrets there:
#   - crates.io: either add a CARGO_REGISTRY_TOKEN environment secret, or
#     configure Trusted Publishing on crates.io (Settings -> Trusted
#     Publishing) for repository jteso/luminatti, workflow file release.yml,
#     environment "release".
#
# Supply-chain hardening applied here (keep these invariants when editing):
#   - Every action is pinned to a full commit SHA (mutable tags can be
#     repointed by a compromised action maintainer — tj-actions, March 2025).
#   - No build caches: release binaries are always built from pristine
#     sources so a poisoned cache entry cannot reach a shipped artifact.
#   - GITHUB_TOKEN starts from zero permissions; each job requests only what
#     it needs, and checkouts do not persist credentials.
#   - The tag and manifest version are validated before any build starts.
#   - Each tarball gets a signed build provenance attestation; verify with:
#     gh attestation verify luminatti-<target>.tar.gz --repo jteso/luminatti

name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  # Only release tags whose commit is already on origin/main and whose
  # manifest version matches the tag.
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # zizmor: ignore[artipacked,ref-version-mismatch] # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, version, and main ancestry
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must have the form vX.Y.Z (got $TAG)"
            exit 1
          fi
          version="${TAG#v}"
          manifest_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          lock_version="$(sed -n '/^name = "luminatti"$/{n;s/^version = "\([^"]*\)"/\1/p;}' Cargo.lock)"
          if [[ "$version" != "$manifest_version" || "$version" != "$lock_version" ]]; then
            echo "::error::Tag $TAG must match Cargo.toml and Cargo.lock"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Tag $TAG must point to a commit on origin/main"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          # Build on the oldest supported Ubuntu so the glibc requirement
          # stays low enough for older distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # checkout only
      id-token: write # sign build provenance attestations (Sigstore OIDC)
      attestations: write # store the attestations
    env:
      TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # ports.ubuntu.com (the only apt mirror for ARM runners) has flapping
      # outages on port 80; use https and retry hard so a release doesn't
      # die on an apt blip.
      - name: Install musl toolchain
        if: ${{ contains(matrix.target, 'musl') }}
        run: |
          sudo sed -i 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          for attempt in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y -o Acquire::Retries=3 musl-tools \
              && break
            echo "apt attempt $attempt failed; retrying in 45s"
            sleep 45
          done
          command -v musl-gcc

      # The runner's preinstalled rustup is used directly rather than a
      # third-party toolchain action — one less supply-chain dependency.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test
        run: |
          out=$("./target/$TARGET/release/luminatti" --version)
          echo "$out"
          echo "$out" | grep -qF "${TAG#v}" || {
            echo "::error::Binary reports wrong version"
            exit 1
          }

      - name: Package
        run: |
          tarball="luminatti-$TARGET.tar.gz"
          tar -czf "$tarball" -C "target/$TARGET/release" luminatti
          if command -v sha256sum >/dev/null; then
            sha256sum "$tarball" > "$tarball.sha256"
          else
            shasum -a 256 "$tarball" > "$tarball.sha256"
          fi
          cat "$tarball.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: luminatti-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luminatti-${{ matrix.target }}
          path: |
            luminatti-${{ matrix.target }}.tar.gz
            luminatti-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  # The desktop preview is intentionally unsigned for now. It is distributed
  # as a normal app zip to ~/Applications, where the user owns the bundle and
  # the in-app updater can atomically replace it without administrator rights.
  desktop:
    name: Package desktop preview (${{ matrix.architecture }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            os: macos-15-intel
          - architecture: arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # zizmor: ignore[artipacked,ref-version-mismatch] # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install Go for Radar helper
        run: |
          if ! command -v go >/dev/null 2>&1; then
            brew install go
          fi
          go version

      - name: Build Luminatti app bundle and zip
        run: bash scripts/build-macos-app.sh --zip

      - name: Upload desktop preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: luminatti-desktop-${{ matrix.architecture }}
          path: |
            target/Luminatti-macos-${{ matrix.architecture }}.zip
            target/Luminatti-macos-${{ matrix.architecture }}.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [prepare, build, desktop]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: luminatti-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/*

  publish-macos-cask:
    name: Publish Luminatti app cask
    needs: [prepare, desktop, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out Homebrew tap
        if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: true

      - name: Download macOS app checksums
        if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: luminatti-desktop-*
          path: dist
          merge-multiple: true

      - name: Update cask in tap
        if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' }}
        run: |
          version="${TAG#v}"
          arm_sha="$(awk 'NF { print $1; exit }' dist/Luminatti-macos-arm64.zip.sha256)"
          intel_sha="$(awk 'NF { print $1; exit }' dist/Luminatti-macos-x64.zip.sha256)"
          [[ "$arm_sha" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$intel_sha" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir -p tap/Casks
          cat > tap/Casks/luminatti.rb <<RUBY
          cask "luminatti" do
            version "$version"

            on_arm do
              url "https://github.com/$GITHUB_REPOSITORY/releases/download/v#{version}/Luminatti-macos-arm64.zip"
              sha256 "$arm_sha"
            end

            on_intel do
              url "https://github.com/$GITHUB_REPOSITORY/releases/download/v#{version}/Luminatti-macos-x64.zip"
              sha256 "$intel_sha"
            end

            name "Luminatti"
            desc "Native macOS code review workspace"
            homepage "https://github.com/$GITHUB_REPOSITORY"

            app "Luminatti.app"
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/luminatti.rb
          if ! git diff --cached --quiet; then
            git commit -m "luminatti cask $version"
            git push
          fi

  publish-crate:
    name: Publish to crates.io
    if: ${{ vars.PUBLISH_CRATE == 'true' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # checkout only
      id-token: write # for crates.io Trusted Publishing
    env:
      HAS_CLASSIC_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Prefer a classic token if configured; otherwise use Trusted Publishing.
      - name: Authenticate with crates.io (Trusted Publishing)
        if: ${{ env.HAS_CLASSIC_TOKEN != 'true' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked
